controller_server:
  ros__parameters:
    # Server Parameters
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001 # 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001 # 0.001
    failure_tolerance: 0.3
    use_realtime_priority: true
    enable_stamped_cmd_vel: false
    publish_zero_velocity: true
    odom_topic: odom
    speed_limit_topic: speed_limit
    # Plugin Configuration
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["precise_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0
    # Goal Checker
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.03 # 0.2
      yaw_goal_tolerance: 0.03 # 0.2
      stateful: false     
    FollowPath:
      plugin: "nav2_teb_controller::TEBController"
      log_level: "debug"  # debug | info | warn | error | fatal
      path_tracker:
        activate: true
        type: "feedforward"
      hcp:
        activate: false
        max_classes: 5
      trajectory:
        reinit_dist: 2.0
        reinit_angle: 3.14159
        auto_resize: true
        dt_ref: 0.2 # 0.25
        dt_hyst: 0.05 # 0.05
        min_samples: 3
        max_samples: 50
        min_seg_length: 0.025 # 0.15
        max_seg_length: 1.0 # 0.10 # 0.3
        max_angle_diff: 0.15 # 0.3
        overwrite_plan_orientation: false
        allow_init_backward: false
        control_look_ahead_poses: 1
        max_global_plan_lookahead_dist: 6.0
        global_plan_prune_distance: 0.25  # has to be smaller than reinit dist
        control_min_look_ahead_time: 0.0
        min_prune_distance: 0.025
      robot:
        footprint:
          use_local_costmap: false
          model: "circles" # circles | polygon
          points: "[ [0.37, -0.01, 0.54], 
                     [1.11, 0.01, 0.54],
                     [-0.51, -0.01, 0.4409],
                     [-0.75, -0.01, 0.3979],
                     [-0.05, 0.01, 0.5232],
                     [0.67, -0.01, 0.54] ]"
        robot_model: "diff_drive"
        wheelbase: 1.055
        v_max_x: 1.5
        v_max_x_backwards: 1.5
        v_max_y: 0.0
        v_max_theta: 1.5
        a_max_x: 0.5
        a_max_y: 0.0
        a_max_theta: 0.5
        jerk_max_x: 3.0 # 7.5 # acc_x*freq/(2 to 5) | 2-5 * 2*acc_x*v_max_theta
        jerk_max_y: 0.0
        jerk_max_theta: 1.5 # 1.5 # 0.5 # (2*5) * (2*acc_x*steering_rate)/wheelbase + (v_x*steering_rate²)/wheelbase 
        snap_max_x: 12.0
        snap_max_theta: 2.5
        steering_rate_max: 0.25 # 0.25 # 0.4
        min_turning_radius: 0.0
        has_steering: true
        use_proportional_saturation: true
      optimizer:
        optimizer_backend: "g2o"
        solver: "eigen"
        algorithm: "levenberg_marquardt"
        activate: true
        fast_mode: true
        exact_arc_length: true
        no_inner_iterations: 8
        no_outer_iterations: 4
        penalty_epsilon: 0.1 # 0.05
        fix_goal: true
        free_goal_vel: false
        verbose: false
        stepwise_optimization: true
        early_exit_min_delta: 0.001
        divergence_detection_enable: true
        divergence_detection_max_chi_squared: 100000.0
        divergence_detection_max_chi_violation_rate: 0.5
        divergence_detection_max_path_length_factor: 3.0
      weights:
        weight_adapt_factor: 1.5
        weight_time_optimal: 2.5 # 1.5 #  keep low 15:1 to kinematic weights
        weight_shortest_path: 1.0 # keep low, conflict with kinematic
        weight_path_smoothness: 5.0 # lower than jerk limits, geometric smoothness, no time dependency, 
        weight_v_max_x: 15.0 # 5.0 # lower weight
        weight_v_max_y: 0.0
        weight_v_max_theta: 10.0 # 3.0 # lower weight
        weight_a_max_x: 30.0 # 15.0 # high weight, direct impact on drive wheel acceleration
        weight_a_max_y: 0.0
        weight_a_max_theta: 40.0 # 20.0 # high weight, impact on drive wheel acceleration, should be higher than acc_x
        weight_jerk_max_x: 0.0 # 0.5 # lower weight
        weight_jerk_max_theta: 0.0 # 0.5 # high weight, impact from steering_rate and acc
        weight_snap_max_x: 0.0
        weight_snap_max_theta: 0.0
        weight_kinematics_nh: 100000.0
        weight_kinematics_forward_drive: 1.0
        weight_kinematics_turning_radius: 0.0 # 100.0
        weight_max_steering_rate: 0.0
        weight_zero_steering_angle_goal: 0.0
        weight_start_steering_angle: 0.0 # 0.0
        weight_goal_angular_vel_zero: 0.0
        weight_g3_continuity: 50.0 # 20.0 # high weight, direct impact from steering_rate for path feasibility
        weight_obstacle: 50.0
        weight_inflation: 5.0
      obstacles:
        include_dynamic_obstacles: false
        legacy_obstacle_association: false
        feasibility_check: 4.0
        min_obstacle_cost: 250
        inflation_dist: 1.7
        min_obstacle_dist: 0.2
        cutoff_dist: 0.2
        cost_exponent: 5.0
        costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
        costmap_converter_rate: 2.0
        costmap_converter_spin_thread: true

      recovery:
        activate: false
        divergence_detection_enable: false
      visualization:
        activate: false
        publish_rate: 30.0
        